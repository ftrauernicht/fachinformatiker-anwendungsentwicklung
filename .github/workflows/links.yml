name: Links prüfen

# Quellenangaben verrotten. Ein Link, der beim Schreiben funktioniert hat, ist
# zwei Jahre später oft ein 404 — und in einer Prüfungssammlung ist eine tote
# Quelle schlimmer als gar keine, weil man ihr nicht mehr nachgehen kann.
#
# Deshalb läuft die Prüfung nicht nur im Pull Request, sondern auch wöchentlich
# gegen den Hauptzweig. Findet sie etwas, legt sie ein Issue an statt still zu
# scheitern, wo es niemand sieht.
on:
  pull_request:
    paths:
      - "**.md"
      - ".lycheeignore"
      - ".github/workflows/links.yml"
  schedule:
    # montags um 06:17 UTC — nicht zur vollen Stunde, da drängeln sich alle
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    name: Erreichbarkeit aller Links
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5

      - name: Zwischenspeicher der letzten Prüfung
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-

      - name: lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --cache
            --max-cache-age 1d
            --no-progress
            --accept 200,206,429
            --max-retries 3
            --timeout 30
            --exclude-path node_modules
            --exclude-path site
            --exclude-path .venv
            "**/*.md"
          fail: false
          output: lychee-report.md

      - name: Issue anlegen oder fortschreiben
        if: steps.lychee.outputs.exit_code != 0 && github.event_name != 'pull_request'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Tote Links in der Sammlung
          content-filepath: lychee-report.md
          labels: |
            wartung
            links

      - name: Im Pull Request scheitern
        if: steps.lychee.outputs.exit_code != 0 && github.event_name == 'pull_request'
        run: |
          echo "## Tote Links" >> "$GITHUB_STEP_SUMMARY"
          cat lychee-report.md >> "$GITHUB_STEP_SUMMARY"
          exit 1
